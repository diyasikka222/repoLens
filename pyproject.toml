[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens"
description = "An intelligent codebase context engine for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "fastembed>=0.5,<1.0",
]

[project.urls]
Homepage = "https://github.com/diyasikka222/repoLens"
Source = "https://github.com/diyasikka222/repoLens"

[tool.setuptools.dynamic]
version = {attr = "repolens.__version__"}

[project.optional-dependencies]
mcp = ["mcp>=1.9,<3"]
dev = ["pytest>=7.0", "mcp>=1.9,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires network/model download (deselect with '-m \"not integration\"')",
]
