[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens"
version = "0.0.1"
description = "An intelligent codebase context engine for AI coding agents"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.5,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires network/model download (deselect with '-m \"not integration\"')",
]
